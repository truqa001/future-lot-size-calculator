<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futures Risk Calculator</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-strong: #edf2f7;
        --border: #d6dde8;
        --text: #172033;
        --muted: #687386;
        --accent: #246bfe;
        --accent-soft: #e7efff;
        --warn-bg: #fff7df;
        --warn-border: #df9f13;
        --warn-text: #6f4a00;
        --err: #bd2c2c;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
      }

      .card {
        width: min(100%, 420px);
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 18px 45px rgb(23 32 51 / 10%);
      }

      h1 {
        margin: 0 0 20px;
        font-size: 22px;
        line-height: 1.2;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      select,
      input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
        color: var(--text);
        font: inherit;
      }

      select:focus,
      input:focus {
        border-color: var(--accent);
        outline: 3px solid var(--accent-soft);
      }

      .result {
        margin-top: 22px;
        padding: 18px;
        border-radius: 8px;
        background: var(--panel-strong);
        text-align: center;
      }

      .contracts {
        font-size: 44px;
        font-weight: 800;
        line-height: 1;
      }

      .contracts span {
        color: var(--muted);
        font-size: 16px;
        font-weight: 500;
      }

      .detail {
        min-height: 18px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .warning,
      .error {
        display: none;
        margin-top: 12px;
        font-size: 13px;
        line-height: 1.45;
      }

      .warning {
        padding: 10px 12px;
        border: 1px solid var(--warn-border);
        border-radius: 8px;
        background: var(--warn-bg);
        color: var(--warn-text);
      }

      .error {
        color: var(--err);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Futures Risk Calculator</h1>

      <label for="ticks">Stop distance (ticks)</label>
      <input
        id="ticks"
        type="number"
        min="1"
        step="1"
        placeholder="e.g. 20"
        inputmode="numeric"
      />

      <label for="product">Product</label>
      <select id="product"></select>

      <label for="risk">Risk amount ($)</label>
      <input
        id="risk"
        type="number"
        min="0"
        step="1"
        placeholder="e.g. 500"
        inputmode="decimal"
      />

      <label for="commission">Commission per contract, round-trip ($)</label>
      <input
        id="commission"
        type="number"
        min="0"
        step="0.01"
        placeholder="e.g. 4.16"
        inputmode="decimal"
      />

      <div class="result" aria-live="polite">
        <div class="contracts">
          <b id="contracts">-</b> <span>contracts</span>
        </div>
        <div class="detail" id="detail"></div>
      </div>

      <div class="warning" id="warning"></div>
      <div class="error" id="error"></div>
    </main>

    <script src="calculator.js"></script>
    <script src="app.js"></script>
  </body>
</html>
